name: C CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-basic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build with required flags
        run: |
          make fclean
          make
          test -x codexion

      - name: Check unnecessary relinking
        run: |
          before=$(stat -c %Y codexion)
          sleep 1
          make
          after=$(stat -c %Y codexion)
          test "$before" = "$after"

      - name: Check Makefile cleanup rules
        run: |
          make clean
          test -x codexion
          test -z "$(find . -maxdepth 1 -name '*.o' -print -quit)"
          make fclean
          test ! -e codexion
          make re
          test -x codexion

      - name: Reject invalid arguments
        run: |
          expect_failure() {
            if timeout 2s ./codexion "$@" >/dev/null 2>&1; then
              echo "unexpected success: $*" >&2
              return 1
            fi
          }
          expect_failure 0 100 10 10 10 1 0 fifo
          expect_failure 1a 100 10 10 10 1 0 fifo
          expect_failure 1 100x 10 10 10 1 0 fifo
          expect_failure 1 100 10 10 10 1 0 invalid
          expect_failure 1 100 10 10 10 1 0

      - name: Run FIFO smoke test
        run: |
          timeout 5s ./codexion 2 1000 10 10 10 2 0 fifo > fifo.log
          test "$(grep -c 'has taken a dongle$' fifo.log)" -eq 8
          test "$(grep -c 'is compiling$' fifo.log)" -eq 4
          test "$(grep -c 'burned out$' fifo.log || true)" -eq 0
          awk 'NF < 3 || $1 !~ /^[0-9]+$/ || $2 !~ /^[1-2]$/ { exit 1 }' fifo.log

      - name: Run EDF smoke test
        run: |
          timeout 5s ./codexion 5 1000 10 10 10 3 2 edf > edf.log
          test "$(grep -c 'is compiling$' edf.log)" -eq 15
          test "$(grep -c 'burned out$' edf.log || true)" -eq 0

      - name: Check single-coder burnout
        run: |
          timeout 5s ./codexion 1 100 10 10 10 1 0 fifo > burnout.log
          test "$(grep -c 'has taken a dongle$' burnout.log)" -eq 1
          test "$(grep -c 'burned out$' burnout.log)" -eq 1
          test "$(tail -n 1 burnout.log)" = "$(grep 'burned out$' burnout.log)"

      - name: Check burnout timing precision
        env:
          BURNOUT_TEST_REPEATS: 10
        run: ./tests/burnout_timing.sh

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cc -Wall -Wextra -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            cmp.c coders.c dongle.c main.c mainloop.c parse.c \
            priority_queue_1.c priority_queue_2.c time.c \
            -o codexion_sanitized

      - name: Run sanitizer completion case
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: timeout 10s ./codexion_sanitized 5 1000 5 5 5 10 1 edf >/dev/null

      - name: Run sanitizer burnout case
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: timeout 5s ./codexion_sanitized 2 30 100 10 10 1 0 fifo >/dev/null
